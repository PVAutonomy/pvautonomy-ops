# edge101-production-base.yaml
# ============================================================
# PVAutonomy Edge101 Production Firmware Base Template
# ============================================================
# Generated by Dashboard for specific customer device
# WiFi credentials come from the operator's own ESPHome secrets.yaml
# Manifest URL is FIXED at compile time (no runtime changes)
# Modbus registers generated from inverter registry
# ============================================================

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  comment: ${comment}
  # Floor for this config, set by two requirements — the higher one wins:
  #   * modbus.turnaround_time (issues #259, PR #264), rejected outright by
  #     ESPHome before 2026.3;
  #   * the read-back transaction (PD-17/C2), whose on_command_sent lambda
  #     needs the 2026.8 modbus_controller API (create_read_command with
  #     modbus::EntityType, parse_and_publish(std::span)); before 2026.8 those
  #     signatures differ and the lambda does not compile.
  # Declared here so ESPHome reports its own "requires at least version
  # 2026.8.0" instead of the uncontextualised "[turnaround_time] is an invalid
  # option" — or a raw C++ compile error — a user would otherwise hit.
  # Mirrors esphome_min_version in firmware-defs/defs-manifest.json. The
  # generator sets this unconditionally — this entry is the base's own copy,
  # not the primary site. Issue #270.
  min_version: 2026.8.0
  project:
    name: PVAutonomy.Edge101
    version: v1.0.0

esp32:
  board: esp32dev
  # DFR0886 carries a 16 MB flash chip (JEDEC 0xEF4018; DFRobot wiki:
  # "On-chip Flash: 16MB"); esp32dev's implicit default is 4 MB. Effective
  # only via a USB flash (partition table) — OTA does not deliver a new
  # layout; already-flashed devices keep theirs until the next cable flash.
  # No psram: block — the DFR0886 has no PSRAM (wiki lists none; a quad
  # PSRAM probe only logs "PSRAM ID read error" on every boot). Issue #258.
  flash_size: 16MB
  framework:
    type: arduino
    version: recommended

logger:
  # baud_rate: 0 turns off the UART logger, so the USB serial console carries
  # bootloader output only and then goes quiet. That silence is deliberate and
  # is normal operation, not a hung device: logs travel over the encrypted
  # ESPHome API instead. Both generators re-assert baud_rate: 0 on every
  # render (esphome/generator/generate_from_registry.py, whose comment reads
  # "remote-safe, API logs only", and yaml_generator.py), which is what a
  # device on a customer's network needs. This is NOT the m5stack-common.yaml
  # rationale: there the console UART *is* the Modbus UART, whereas Edge101
  # runs Modbus on GPIO17/36 and leaves the console pins free. Read application
  # logs via the Device Builder's Logs button or `esphome logs`. Issue #269.
  level: INFO
  baud_rate: 0

api:
  encryption:
    key: "${api_encryption_key}"

ota:
  - platform: esphome
    password: "${ota_password}"

# Time source for the uptime timestamp sensor. ESPHome's uptime sensor with
# `type: timestamp` requires a Time component; `platform: homeassistant` rides
# the existing api: connection (no SNTP/internet needed on the local PV LAN).
time:
  - platform: homeassistant
    id: ha_time

# Wi-Fi follows the ESPHome convention: the device joins the operator's own
# network from their own ESPHome secrets.yaml. The generator rewrites this
# block and emits `!secret wifi_ssid` / `!secret wifi_password` — references
# only, never a credential value.
#
# Deliberately absent (ADR-0005 / PD-14; master-todo F-19):
#   * wifi.ap        — a fallback AP keyed with a shared, class-wide password
#                      is a universal default credential in every image;
#   * captive_portal — an unauthenticated credential-submit surface;
#   * web_server     — an unauthenticated read/control surface on port 80.
#
# Do not reintroduce them here. The generator removes all three anyway
# (yaml_generator._apply_production_network_and_logging), so adding them back
# would only mislead a reader of this file.
#
# The "${...}" placeholders below follow this template's existing convention
# (compare "${api_encryption_key}" above): the generator substitutes them, and
# writing a bare !secret tag here instead would make the template unreadable
# to plain yaml.safe_load consumers.
wifi:
  ssid: "${wifi_ssid}"
  password: "${wifi_password}"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Adresse"
      id: wifi_ip

sensor:
  - platform: uptime
    # `type: timestamp` reports the boot time and auto-sets
    # `device_class: timestamp`, so Home Assistant renders a localized,
    # adaptive "vor X" instead of a raw seconds counter. Entity_id stays
    # `..._uptime` (name-derived), so the dashboard resolver match is unchanged.
    type: timestamp
    name: "Uptime"
    id: uptime_sensor

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

switch:
  - platform: restart
    name: "Neustart"
    id: restart_switch

button:
  - platform: factory_reset
    name: "Factory Reset"
    id: factory_reset_btn

# ============================================================
# Modbus Configuration
# ============================================================
# Generated from inverter registry by Dashboard
# ============================================================
uart:
- id: uart_modbus
  baud_rate: 9600
  tx_pin: 17
  rx_pin: 36
  stop_bits: 1

modbus:
- id: modbus1
  uart_id: uart_modbus
  flow_control_pin: 16
  # Command spacing (ESPHome ≥ 2026.8; issue #259). 200 ms is measured, not
  # guessed: ~212/214 ms live on both production Edges (baseline 2026-08-25),
  # 18-transaction SPH cycle 4.53 s on the bench (P1b 2026-08-26); the 600 ms
  # default misses the 10 s cadence (11.7 s). Do not reintroduce
  # modbus_controller.command_throttle — dead since 2026.8, removed in 2027.2.
  turnaround_time: 200ms

modbus_controller:
- id: inverter
  address: 1
  modbus_id: modbus1
  update_interval: 10s

# ============================================================
# Modbus Entities (Generated from Registry)
# ============================================================
# Sensors, numbers, switches will be injected here by generator
# ============================================================
