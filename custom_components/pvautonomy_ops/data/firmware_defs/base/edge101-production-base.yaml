# edge101-production-base.yaml
# ============================================================
# PVAutonomy Edge101 Production Firmware Base Template
# ============================================================
# Generated by Dashboard for specific customer device
# WiFi credentials from NVS (persisted by Factory firmware)
# Manifest URL is FIXED at compile time (no runtime changes)
# Modbus registers generated from inverter registry
# ============================================================

substitutions:
  wifi_fallback_password: "pvautonomy2026"

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  comment: ${comment}
  project:
    name: PVAutonomy.Edge101
    version: v1.0.0

esp32:
  board: esp32dev
  framework:
    type: arduino
    version: recommended

psram:
  mode: quad
  speed: 80MHz

logger:
  level: INFO
  baud_rate: 0

api:
  encryption:
    key: "${api_encryption_key}"

ota:
  - platform: esphome
    password: "${ota_password}"

# Time source for the uptime timestamp sensor. ESPHome's uptime sensor with
# `type: timestamp` requires a Time component; `platform: homeassistant` rides
# the existing api: connection (no SNTP/internet needed on the local PV LAN).
time:
  - platform: homeassistant
    id: ha_time

wifi:
  # WiFi credentials persisted in NVS by Factory firmware
  # No SSID/password needed here - ESP32 remembers them
  ap:
    ssid: "${devicename} Fallback"
    password: "${wifi_fallback_password}"

captive_portal:

web_server:
  port: 80
  include_internal: true

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Adresse"
      id: wifi_ip

sensor:
  - platform: uptime
    # `type: timestamp` reports the boot time and auto-sets
    # `device_class: timestamp`, so Home Assistant renders a localized,
    # adaptive "vor X" instead of a raw seconds counter. Entity_id stays
    # `..._uptime` (name-derived), so the dashboard resolver match is unchanged.
    type: timestamp
    name: "Uptime"
    id: uptime_sensor

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

switch:
  - platform: restart
    name: "Neustart"
    id: restart_switch

button:
  - platform: factory_reset
    name: "Factory Reset"
    id: factory_reset_btn

# ============================================================
# Modbus Configuration
# ============================================================
# Generated from inverter registry by Dashboard
# ============================================================
uart:
- id: uart_modbus
  baud_rate: 9600
  tx_pin: 17
  rx_pin: 36
  stop_bits: 1

modbus:
- id: modbus1
  uart_id: uart_modbus
  flow_control_pin: 16

modbus_controller:
- id: inverter
  address: 1
  modbus_id: modbus1
  update_interval: 10s
  command_throttle: 200ms

# ============================================================
# Modbus Entities (Generated from Registry)
# ============================================================
# Sensors, numbers, switches will be injected here by generator
# ============================================================
